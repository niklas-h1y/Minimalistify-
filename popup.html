<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 220px;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      padding: 14px;
      margin: 0;
      background: #121212;
      color: #ffffff;
      text-align: center;
    }
    h3 { 
      margin: 0 0 12px 0; 
      font-size: 15px; 
      letter-spacing: 1.5px;
      font-weight: 600;
    }
    button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border: none;
      background: #252525;
      color: #fff;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.2s;
    }
    button:hover { background: #353535; }
    .reset { background: #b22222; }
    .reset:hover { background: #dc143c; }
  </style>
</head>
<body>
  <h3>𝐌𝐢𝐧𝐢𝐦𝐚𝐥𝐢𝐬𝐭𝐢𝐟𝐲</h3>
  <button id="btn-mild">Mild (Clean & Round)</button>
  <button id="btn-hard">Hardcore (B&W Mono)</button>
  <button id="btn-reset" class="reset">Reset Style</button>

  <script src="popup.js"></script>
</body>
</html>
